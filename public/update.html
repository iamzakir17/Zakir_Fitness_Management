<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Product | Zakir Fitness Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="update" data-title="Update Product" data-sub="Change price, stock or reorder level">
<div id="content">
<form class="card lk" id="lk"><label>Product ID<input id="lid" placeholder="e.g. SPT-101" autocomplete="off"></label><button class="btn" type="submit"><i class="fa-solid fa-magnifying-glass"></i> Find product</button></form>
<div id="ucard" hidden><form class="card form" id="uf" novalidate><h3>Edit details</h3>
<div class="row">
<label>Product ID<input name="product_id" placeholder="e.g. SPT-201" autocomplete="off" readonly></label>
<label>Product Name<input name="product_name" placeholder="e.g. Boxing Gloves 12 oz" autocomplete="off"></label>
</div>
<div class="row3">
<label>Price (&#8377;)<input name="product_price" type="number" step="0.01" min="0" placeholder="0.00"></label>
<label>Quantity in stock<input name="product_quantity" type="number" step="1" min="0" placeholder="0"></label>
<label>Reorder level<input name="reorder_level" type="number" step="1" min="0" placeholder="10"></label>
</div>
<div class="actions"><button class="btn" id="usave" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save changes</button><a class="btn ghost" href="list.html">Back to list</a></div></form></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
