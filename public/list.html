<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products | Zakir Fitness Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="list" data-title="All Products" data-sub="Complete equipment inventory">
<div id="content">
<div class="card tools">
<div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" placeholder="Filter by product ID or name..."></div>
<select id="st"><option value="all">All stock levels</option><option value="ok">In stock</option><option value="low">Low stock</option><option value="out">Out of stock</option></select>
<select id="so"><option value="id">Sort: Product ID</option><option value="name">Sort: Name A-Z</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="qty-asc">Quantity: low to high</option><option value="qty-desc">Quantity: high to low</option></select>
<button class="btn ghost" id="rf" title="Refresh"><i class="fa-solid fa-rotate"></i></button>
<a class="btn" href="insert.html"><i class="fa-solid fa-plus"></i> Add</a>
</div>
<div class="mini" id="count"></div>
<div class="card tbl"><div class="scroll"><table>
<thead><tr><th>ID</th><th>Product</th><th>Price</th><th>Stock</th><th>Reorder</th><th>Status</th><th>Actions</th></tr></thead>
<tbody id="rows"></tbody></table></div>
<div class="empty" id="empty" hidden><i class="fa-solid fa-box-open"></i><b>No products found</b><span>Try a different filter or add a new product.</span></div></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
