<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product | Zakir Fitness Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="insert" data-title="Add Product" data-sub="Register new fitness or sports equipment">
<div id="content">
<div class="split">
<form id="f" class="card form" novalidate>
<div class="row">
<label>Product ID<input name="product_id" placeholder="e.g. SPT-201" autocomplete="off"></label>
<label>Product Name<input name="product_name" placeholder="e.g. Boxing Gloves 12 oz" autocomplete="off"></label>
</div>
<div class="row3">
<label>Price (&#8377;)<input name="product_price" type="number" step="0.01" min="0" placeholder="0.00"></label>
<label>Quantity in stock<input name="product_quantity" type="number" step="1" min="0" placeholder="0"></label>
<label>Reorder level<input name="reorder_level" type="number" step="1" min="0" placeholder="10"></label>
</div>
<div class="actions"><button class="btn" id="save" type="submit"><i class="fa-solid fa-plus"></i> Save product</button><button class="btn ghost" type="reset">Clear</button></div>
</form>
<aside class="card"><h3>Stock preview</h3><div class="prev" id="preview"></div>
<ul class="tips"><li>Product ID must be unique.</li><li>Quantity at or below the reorder level is flagged as low stock.</li><li>Quantity 0 is marked out of stock.</li></ul></aside>
</div>
</div>
<script src="js/app.js"></script>
</body>
</html>
